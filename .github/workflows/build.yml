name: Build & Release

on:
  push:
    branches: [ main, dev ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  BUILD_CONFIGURATION: Release
  BUILD_PLATFORM: x64

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install WDK
      run: |
        # 下载并安装 WDK
        $wdkUrl = "https://go.microsoft.com/fwlink/?linkid=2249371"
        $wdkInstaller = "$env:TEMP\wdksetup.exe"
        Write-Host "下载 WDK..."
        Invoke-WebRequest -Uri $wdkUrl -OutFile $wdkInstaller
        Write-Host "安装 WDK..."
        Start-Process -FilePath $wdkInstaller -ArgumentList "/features", "+", "/quiet", "/norestart", "/ceip", "off" -Wait -NoNewWindow
        Write-Host "WDK 安装完成"

        $wdkRoot = "C:\Program Files (x86)\Windows Kits\10"
        # 检测包含 km 目录的 WDK 版本 (区别于预装的 Windows SDK)
        $wdkVer = (Get-ChildItem "$wdkRoot\Include" -Directory | Where-Object { Test-Path "$($_.FullName)\km" } | Sort-Object Name -Descending | Select-Object -First 1).Name
        if (-not $wdkVer) {
          Write-Host "Include 目录内容:"
          Get-ChildItem "$wdkRoot\Include" -Directory | ForEach-Object {
            $subs = (Get-ChildItem $_.FullName -Directory).Name -join ", "
            Write-Host "  $($_.Name): [$subs]"
          }
          Write-Error "未找到包含 km 目录的 WDK 版本!"
          exit 1
        }
        Write-Host "WDK 版本 (含 km): $wdkVer"
        Write-Host "ntddk.h: $(Test-Path "$wdkRoot\Include\$wdkVer\km\ntddk.h")"

        # 解压 WDK VSIX 并手动部署 MSBuild 目标文件
        $wdkVsix = (Get-ChildItem "$wdkRoot\Vsix" -Recurse -Filter "WDK.vsix" | Select-Object -First 1).FullName
        Write-Host "VSIX: $wdkVsix"

        $extractDir = "$env:TEMP\wdk-vsix"
        Expand-Archive -LiteralPath $wdkVsix -DestinationPath $extractDir -Force

        # 列出解压根目录内容 (诊断)
        Write-Host "VSIX 解压顶层目录:"
        Get-ChildItem -LiteralPath $extractDir | ForEach-Object { Write-Host "  $($_.Name)" }

        # 查找 VS MSBuild 目录
        $vsBasePath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
        if (-not (Test-Path $vsBasePath)) {
          $vsBasePath = (Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\*" -Directory | Select-Object -First 1).FullName
        }
        $vsMSBuildDir = "$vsBasePath\MSBuild"
        Write-Host "VS MSBuild 目录: $vsMSBuildDir"

        # 复制 MSBuild 目标文件 (VSIX 中的 $MSBuild 目录)
        # 注意: 使用 -LiteralPath 避免 PowerShell 解释 $ 符号
        $msbuildSrc = [System.IO.Path]::Combine($extractDir, '$MSBuild')
        Write-Host "MSBuild 源路径: $msbuildSrc"
        Write-Host "MSBuild 源路径存在: $(Test-Path -LiteralPath $msbuildSrc)"

        if (Test-Path -LiteralPath $msbuildSrc) {
          Write-Host "MSBuild 源目录内容:"
          Get-ChildItem -LiteralPath $msbuildSrc | ForEach-Object { Write-Host "  $($_.Name)" }

          # 使用 robocopy 合并目录 (Copy-Item 不能正确合并已有目录树)
          $srcNative = [System.IO.Path]::GetFullPath($msbuildSrc)
          robocopy "$srcNative" "$vsMSBuildDir" /E /NFL /NDL /NJH /NJS /NC /NS
          if ($LASTEXITCODE -ge 8) { Write-Error "robocopy 失败, 退出码: $LASTEXITCODE"; exit 1 }
          $global:LASTEXITCODE = 0
          Write-Host "MSBuild 目标文件部署成功 (robocopy)"
        } else {
          Write-Host "未找到 `$MSBuild 目录, 尝试其他目录名..."
          Get-ChildItem -LiteralPath $extractDir -Directory | ForEach-Object {
            Write-Host "  检查: $($_.Name)"
            if ($_.Name -match 'MSBuild|msbuild|Build') {
              Write-Host "  => 找到候选目录: $($_.FullName)"
              $items = Get-ChildItem -LiteralPath $_.FullName
              foreach ($item in $items) {
                Copy-Item -LiteralPath $item.FullName -Destination (Join-Path $vsMSBuildDir $item.Name) -Recurse -Force
              }
              Write-Host "  => 已复制"
            }
          }
        }

        # 验证: 检查内核驱动工具集是否存在
        $toolsetDirs = Get-ChildItem $vsMSBuildDir -Recurse -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -like "WindowsKernelModeDriver*" }
        if ($toolsetDirs) {
          Write-Host "内核驱动工具集已就绪:"
          $toolsetDirs | ForEach-Object { Write-Host "  $($_.FullName)" }
        } else {
          Write-Host "警告: 未找到内核驱动工具集!"
          Write-Host "已有的 PlatformToolsets:"
          Get-ChildItem "$vsMSBuildDir\Microsoft\VC\v170\Platforms\x64\PlatformToolsets" -Directory -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.Name)" }
        }

        # 设置 WDK 环境变量供后续步骤使用
        echo "WDKContentRoot=$wdkRoot\" >> $env:GITHUB_ENV
        echo "WDK_VERSION=$wdkVer" >> $env:GITHUB_ENV
        Write-Host "已设置 WDKContentRoot=$wdkRoot\ , WDK_VERSION=$wdkVer"
      shell: pwsh

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install WiX Toolset
      run: |
        dotnet tool install --global wix --version 5.*
        wix extension add WixToolset.UI.wixext
        wix extension add WixToolset.Util.wixext
      shell: pwsh

    - name: Create test certificate
      run: |
        $cert = New-SelfSignedCertificate `
          -Type CodeSigningCert `
          -Subject "CN=DDCBrightness Test, O=DDCBrightness Project" `
          -CertStoreLocation Cert:\CurrentUser\My `
          -NotAfter (Get-Date).AddYears(3)

        $thumbprint = $cert.Thumbprint
        Write-Host "证书指纹: $thumbprint"
        echo "CERT_THUMBPRINT=$thumbprint" >> $env:GITHUB_ENV

        New-Item -ItemType Directory -Path "build" -Force | Out-Null
        Export-Certificate -Cert "Cert:\CurrentUser\My\$thumbprint" -FilePath "build\DDCBrightness-test.cer"
      shell: pwsh

    - name: Build driver
      env:
        WDKContentRoot: C:\Program Files (x86)\Windows Kits\10\
      run: |
        msbuild driver\DDCBrightness.vcxproj `
          /p:Configuration=${{ env.BUILD_CONFIGURATION }} `
          /p:Platform=${{ env.BUILD_PLATFORM }} `
          /p:WDKVersion=${{ env.WDK_VERSION }} `
          /p:SignMode=TestSign `
          /p:TestCertificate=${{ env.CERT_THUMBPRINT }} `
          /verbosity:normal
      shell: pwsh

    - name: Build service
      run: |
        msbuild service\DDCBrightnessService.vcxproj `
          /p:Configuration=${{ env.BUILD_CONFIGURATION }} `
          /p:Platform=${{ env.BUILD_PLATFORM }}
      shell: pwsh

    - name: Build test tool
      run: |
        msbuild tools\DDCTest.vcxproj `
          /p:Configuration=${{ env.BUILD_CONFIGURATION }} `
          /p:Platform=${{ env.BUILD_PLATFORM }}
      shell: pwsh

    - name: Sign driver
      run: |
        $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
        if (-not $signtool) {
          Write-Error "signtool.exe 未找到"
          exit 1
        }

        $driverSys = "build\${{ env.BUILD_CONFIGURATION }}\${{ env.BUILD_PLATFORM }}\DDCBrightness.sys"
        & $signtool.FullName sign /s My /n "DDCBrightness Test" /fd SHA256 $driverSys
        Write-Host "驱动已签名"
      shell: pwsh

    - name: Build MSI installer
      run: |
        $buildDir = "build\${{ env.BUILD_CONFIGURATION }}\${{ env.BUILD_PLATFORM }}"

        wix build installer\Package.wxs `
          -ext WixToolset.UI.wixext `
          -ext WixToolset.Util.wixext `
          -d BuildDir="$buildDir" `
          -d CertFile="build\DDCBrightness-test.cer" `
          -d InfFile="driver\DDCBrightness.inf" `
          -d Version="1.0.0.0" `
          -arch x64 `
          -o "$buildDir\DDCBrightness-Setup.msi"
      shell: pwsh

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: DDCBrightness-${{ env.BUILD_CONFIGURATION }}-${{ env.BUILD_PLATFORM }}
        path: |
          build/${{ env.BUILD_CONFIGURATION }}/${{ env.BUILD_PLATFORM }}/DDCBrightness.sys
          build/${{ env.BUILD_CONFIGURATION }}/${{ env.BUILD_PLATFORM }}/DDCBrightnessService.exe
          build/${{ env.BUILD_CONFIGURATION }}/${{ env.BUILD_PLATFORM }}/ddc_test.exe
          build/${{ env.BUILD_CONFIGURATION }}/${{ env.BUILD_PLATFORM }}/DDCBrightness-Setup.msi
          build/DDCBrightness-test.cer
          driver/DDCBrightness.inf

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: DDCBrightness-Release-x64
        path: release-files

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: DDCBrightness ${{ github.ref_name }}
        draft: true
        generate_release_notes: true
        files: |
          release-files/**/*.msi
          release-files/**/*.exe
          release-files/**/*.sys
          release-files/**/*.cer
          release-files/**/*.inf
        body: |
          ## DDCBrightness ${{ github.ref_name }}

          通过 DDC/CI 协议使 Windows 内置亮度滑块控制外置显示器。

          ### 安装说明

          1. 下载 `DDCBrightness-Setup.msi`
          2. 以管理员身份运行安装程序
          3. 按提示启用测试签名模式并重启
          4. 重启后亮度滑块即可在 Windows 快捷设置中使用

          > **注意**: 当前版本使用测试签名，安装后桌面右下角会显示「测试模式」水印。

          ### 前置要求
          - Windows 10/11 x64
          - 外置显示器需支持 DDC/CI
